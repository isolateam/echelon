    <title>breakium</title>
    <style>
      @font-face {
        font-family: "FONT2";
        src: url("/data/fonts/AlteHaasGroteskRegular.ttf");
      }

      :root {
        --bg: #121113;
        --bar: #19171a;
        --tab-idle: rgba(255, 255, 255, 0.035);
        --tab-hover: rgba(255, 255, 255, 0.07);
        --tab-active: #262227;
        --text: #eee8e1;
        --text-muted: #96908a;
        --hairline: rgba(255, 255, 255, 0.06);
        --signal: #e8a33d;
      }

      * {
        font-family: "FONT2", sans-serif;
        box-sizing: border-box;
      }

      html, body {
        height: 100%;
        margin: 0;
      }

      body {
        background-color: var(--bg);
        color: var(--text);
      }

      .container {
        position: relative;
        width: 100vw;
        height: 100vh;
      }
      #tabcontainer {
        width: 100%;
        height: 42px;
        background: var(--bar);
        border-bottom: 1px solid var(--hairline);
        padding: 7px 10px 0 10px;
        box-sizing: border-box;
        position: relative;
        z-index: 2;
      }

      #tabs {
        display: flex;
        align-items: flex-end;
        height: 100%;
        gap: 2px;
        overflow-x: auto;
        overflow-y: hidden;
      }

      #tabs::-webkit-scrollbar {
        height: 3px;
      }

      #tabs::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 3px;
      }

      button {
        background: none;
        color: var(--text-muted);
        border: 0;
        cursor: pointer;
        transition: background-color 0.15s ease, color 0.15s ease;
      }

      #tab {
        height: 32px;
        min-width: 168px;
        max-width: 220px;
        display: block;
        margin: 0 1px;
        padding: 0 12px 0 28px;
        font-size: 12.5px;
        font-weight: 500;
        text-align: left;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        background-color: var(--tab-idle);
        background-repeat: no-repeat;
        background-position: 10px center;
        background-size: 14px;
        border-radius: 8px 8px 0 0;
        flex-shrink: 0;
      }
      #tab:hover {
        background-color: var(--tab-hover);
        color: var(--text);
      }

      .active {
        background-color: var(--tab-active) !important;
        color: var(--text);
        font-weight: 600;
        position: relative;
        z-index: 1;
      }
      .active::after {
        content: "";
        position: absolute;
        left: 10px;
        right: 10px;
        bottom: -1px;
        height: 2px;
        background: var(--signal);
        border-radius: 2px;
        box-shadow: 0 0 6px 0 rgba(232, 163, 61, 0.55);
      }
      #x,#plus {
        width: 28px;
        height: 28px;
        min-width: 28px;
        margin-bottom: 2px;
        border-radius: 50%;
        font-size: 15px;
        line-height: 1;
        flex-shrink: 0;
      }

      #x:hover,
      #plus:hover {
        background-color: var(--tab-hover);
        color: var(--text);
      }

      #x {
        margin-left: 8px;
        margin-right: 6px;
        color: var(--text-muted);
      }
      iframe {
        width: 100vw;
        height: calc(100vh - 42px);
        border: none;
        z-index: 0;
        position: absolute;
        top: 42px;
        left: 0;
        display: none;
        background: var(--bg);
      }

      .active-iframe {
        display: block;
      }

      #icon {
        width: 16px;
        height: 16px;
        vertical-align: middle;
        margin-right: 5px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="tabcontainer">
        <div id="tabs">
          <button id="x">×</button>
          <button id="plus">+</button>
        </div>
      </div>
    </div>
    <script>
      const tabcontainer = document.getElementById("tabcontainer");
      const tabs = document.getElementById("tabs");
      const x = document.getElementById("x");
      const plus = document.getElementById("plus");
      let activeTabs = [];
      let activeIframes = [];
      function createTab() {
        const tab = document.createElement("button");
        const iframe = document.createElement("iframe");
        const img = document.getElementById("icon");
        tab.id = "tab";
        tab.textContent = "Loading..";
        iframe.src = "/null";
        setInterval(function () { 
          tab.textContent = iframe.contentWindow.document.getElementById('fram').contentDocument.title; 
          if (iframe.contentWindow.document.getElementById('fram').contentDocument.querySelector('link[rel="icon"]')) {
            tab.style.backgroundImage = `url(${iframe.contentWindow.document.getElementById('fram').contentDocument.querySelector('link[rel="icon"]').href})`;
          } else {
            tab.style.backgroundImage = `url(/data/images/tabs/icon.png)`;
          }
        }, 1000);
        tabcontainer.appendChild(iframe);
        tabs.appendChild(tab);
        tab.addEventListener("click", function () {
          activateTab(tab, iframe);
        });
        activateTab(tab, iframe);
      }
      function activateTab(tab, iframe) {
        activeTabs.forEach((tab) => tab.classList.remove("active"));
        activeIframes.forEach((iframe) =>
          iframe.classList.remove("active-iframe")
        );
        activeIframes = activeIframes.filter((item) => item !== iframe);
        activeTabs = activeTabs.filter((item) => item !== tab);
        activeTabs.push(tab);
        activeIframes.push(iframe);
        tab.classList.add("active");
        iframe.classList.add("active-iframe");
      }
      plus.addEventListener("click", createTab);
      x.addEventListener("click", function () {
        const activeTab = activeTabs.pop();
        const activeIframe = activeIframes.pop();
        if (activeTab && activeIframe) {
          activeTab.classList.remove("active");
          activeIframe.classList.remove("active-iframe");
          activeIframe.remove();
          activeTab.remove();
          if (activeTabs.length > 0) {
            const lastTab = activeTabs[activeTabs.length - 1];
            const lastIframe = activeIframes[activeIframes.length - 1];
            activateTab(lastTab, lastIframe);
          }
        }
      });
      window.addEventListener("load", createTab);
    </script>
    
    <script src="./data/js/loading.js"></script>
    <script src="./data/js/theme.js"></script>
