<html lang="en">

<meta charset="UTF-8">
<link rel="icon" href="https://www.desmos.com/assets/img/apps/graphing/favicon.ico">
<link rel="shortcut icon" href="https://www.desmos.com/assets/img/apps/graphing/favicon.ico">
<title>Desmos | Graphing Calculator</title>
<style>
  @font-face {
    font-family: 'FONT2';
    src: url('./data/fonts/AlteHaasGroteskRegular.ttf');
  }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
    font-family: 'FONT2', system-ui, sans-serif;
    color: #eee;
  }
  .box {
    background: #1a1d23;
    padding: 2.5rem 3rem;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  h1 { font-size: 1.3rem; margin-bottom: 1.5rem; }
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    background: #22262e;
    padding: 1rem 1.5rem;
    border-radius: 8px;
    cursor: pointer;
    user-select: none;
  }
  .checkbox-row input {
    width: 22px;
    height: 22px;
    cursor: pointer;
  }
  #status {
    margin-top: 1rem;
    font-size: 0.9rem;
    color: #8a8f98;
    min-height: 1.2em;
  }
  #bg-canvas {
    position: fixed;
    inset: 0;
    z-index: -1;
    display: block;
  }
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div class="box">
  <h1>Making sure ur not a robot</h1>
  <label class="checkbox-row">
    <input type="checkbox" id="humanCheck">
    <span>i AM a real person :)</span>
  </label>
  <div id="status">just click it bra</div>
</div>

<script>
  const checkbox = document.getElementById('humanCheck');
  const status = document.getElementById('status');
  let mouseMoved = false;

  document.addEventListener('mousemove', () => { mouseMoved = true; }, { once: true });

  checkbox.addEventListener('change', () => {
    if (!checkbox.checked) return;

    if (!mouseMoved) {
      status.textContent = "Hmm, that didn't look human. Try again.";
      checkbox.checked = false;
      return;
    }

    status.textContent = "verifying..";
    checkbox.disabled = true;

    setTimeout(() => {
      sessionStorage.setItem('humanVerified', 'true');
      sessionStorage.setItem('verifiedAt', Date.now().toString());
      status.textContent = "verified. sending you to breakium..";
      setTimeout(() => {
        window.location.href = '/index';
      }, 500);
    }, 800);
  });
</script>
<script>
        (function() {
            const canvas = document.getElementById('bg-canvas');
            const ctx = canvas.getContext('2d');
            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 
            let width, height, dpr;
            let particles = [];
            const mouse = { x: null, y: null };
            let accentRgb = [59, 130, 246]; // fallback matches --accent-blue
 
            function hexToRgb(hex) {
                const clean = hex.trim().replace('#', '');
                const parts = clean.match(/.{1,2}/g);
                if (!parts || parts.length < 3) return accentRgb;
                return parts.slice(0, 3).map(h => parseInt(h, 16));
            }
 
            function readAccent() {
                const value = getComputedStyle(document.body).getPropertyValue('--accent-blue');
                if (value) accentRgb = hexToRgb(value);
            }
 
            function resize() {
                dpr = window.devicePixelRatio || 1;
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width * dpr;
                canvas.height = height * dpr;
                canvas.style.width = width + 'px';
                canvas.style.height = height + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
 
                const count = Math.min(Math.round((width * height) / 16000), 90);
                particles = Array.from({ length: count }, () => ({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.25,
                    vy: (Math.random() - 0.5) * 0.25,
                    r: Math.random() * 1.3 + 0.6
                }));
            }
 
            function frame() {
                readAccent();
                const [r, g, b] = accentRgb;
                ctx.clearRect(0, 0, width, height);
 
                for (const p of particles) {
                    p.x += p.vx;
                    p.y += p.vy;
 
                    if (mouse.x !== null) {
                        const dx = p.x - mouse.x;
                        const dy = p.y - mouse.y;
                        const dist = Math.hypot(dx, dy);
                        if (dist < 120 && dist > 0.01) {
                            const force = (120 - dist) / 120;
                            p.x += (dx / dist) * force * 1.6;
                            p.y += (dy / dist) * force * 1.6;
                        }
                    }
 
                    if (p.x < -10) p.x = width + 10;
                    if (p.x > width + 10) p.x = -10;
                    if (p.y < -10) p.y = height + 10;
                    if (p.y > height + 10) p.y = -10;
                }
 
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const a = particles[i], p2 = particles[j];
                        const dist = Math.hypot(a.x - p2.x, a.y - p2.y);
                        if (dist < 130) {
                            ctx.strokeStyle = `rgba(${r},${g},${b},${0.1 * (1 - dist / 130)})`;
                            ctx.lineWidth = 1;
                            ctx.beginPath();
                            ctx.moveTo(a.x, a.y);
                            ctx.lineTo(p2.x, p2.y);
                            ctx.stroke();
                        }
                    }
                }
 
                for (const p of particles) {
                    ctx.fillStyle = `rgba(${r},${g},${b},0.4)`;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fill();
                }
 
                if (!reduceMotion) requestAnimationFrame(frame);
            }
 
            function handlePointer(e) {
                const point = e.touches ? e.touches[0] : e;
                mouse.x = point.clientX;
                mouse.y = point.clientY;
            }
 
            window.addEventListener('resize', resize);
            window.addEventListener('mousemove', handlePointer);
            window.addEventListener('touchmove', handlePointer, { passive: true });
            window.addEventListener('mouseleave', function() {
                mouse.x = null;
                mouse.y = null;
            });
 
            resize();
            frame();
        })();
    </script>
</body>
</html>
