<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./data/images/favicon-transparent.png" />
    <link rel="shortcut icon" href="./data/images/favicon-transparent.png" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5808709323793475"
     crossorigin="anonymous"></script>
    <title>breakium</title>
    <style>
      @font-face {
        font-family: "FONT2";
        src: url("/data/fonts/AlteHaasGroteskRegular.ttf");
      }

      * {
        font-family: "FONT2", sans-serif;
        box-sizing: border-box;
      }

      html, body {
        height: 100%;
        margin: 0;
      }

      body {
        background-color: #101114;
        color: #ececee;
        transition: background-color 0.5s ease;
      }

      .container {
        position: relative;
        width: 100vw;
        height: 100vh;
      }

      #tabcontainer {
        width: 100%;
        height: 40px;
        background: #141517;
        padding: 6px 8px 0 8px;
        box-sizing: border-box;
        position: relative;
        z-index: 2;
      }

      #tabs {
        display: flex;
        align-items: flex-end;
        gap: 4px;
        height: 100%;
        overflow-x: auto;
        overflow-y: hidden;
      }

      #tabs::-webkit-scrollbar {
        height: 3px;
      }

      #tabs::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 3px;
      }

      button {
        background: rgba(255, 255, 255, 0.04);
        color: rgba(255, 255, 255, 0.85);
        width: 30px;
        height: 32px;
        border: 1px solid transparent;
        border-bottom: none;
        font-size: 12.5px;
        margin-bottom: 0;
        border-top-left-radius: 9px;
        border-top-right-radius: 9px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: background 0.15s ease, color 0.15s ease;
        background-repeat: no-repeat;
        background-position: center;
        cursor: pointer;
        flex-shrink: 0;
      }

      button:hover {
        background-color: rgba(255, 255, 255, 0.09);
        box-shadow: none;
        color: #fff;
      }

      #tab {
        height: 32px;
        min-width: 160px;
        max-width: 220px;
        width: auto;
        margin: 0;
        padding-left: 26px;
        background-size: 14px;
        background-position: 10px center;
      }

      #x,
      #plus {
        min-width: 30px;
      }

      #x {
        margin-left: 10px;
      }

      .active {
        background-color: #24262b !important;
        color: #fff;
        border-color: rgba(255, 255, 255, 0.08);
        position: relative;
        z-index: 1;
      }

      .active::before {
        content: "";
        position: absolute;
        top: 0px;
        left: -1px;
        right: -1px;
        bottom: -1px;
        border: none;
        border-radius: 0;
      }

      .active::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: -1px;
        height: 2px;
        background: #7aa2ff;
        border-radius: 2px;
      }

      iframe {
        width: 100vw;
        height: calc(100vh - 40px);
        border: none;
        border-radius: 0;
        z-index: 0;
        position: absolute;
        top: 40px;
        left: 0;
        display: none;
        background: #101114;
      }

      .active-iframe {
        display: block;
        outline: none;
      }

      #icon {
        width: 16px;
        height: 16px;
        vertical-align: middle;
        margin-right: 5px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="tabcontainer">
        <div id="tabs">
          <button id="x">X</button>
          <button id="plus">+</button>
        </div>
      </div>
    </div>
    <script>
      const tabcontainer = document.getElementById("tabcontainer");
      const tabs = document.getElementById("tabs");
      const x = document.getElementById("x");
      const plus = document.getElementById("plus");
      let activeTabs = [];
      let activeIframes = [];
      function createTab() {
        const tab = document.createElement("button");
        const iframe = document.createElement("iframe");
        const img = document.getElementById("icon");
        tab.textContent = "Loading..";
        iframe.src = "/null";
        setInterval(function () { 
          tab.textContent = iframe.contentWindow.document.getElementById('fram').contentDocument.title; 
          if (iframe.contentWindow.document.getElementById('fram').contentDocument.querySelector('link[rel="icon"]')) {
            tab.style.backgroundImage = `url(${iframe.contentWindow.document.getElementById('fram').contentDocument.querySelector('link[rel="icon"]').href})`;
          } else {
            tab.style.backgroundImage = `url(/data/images/tabs/icon.png)`;
          }
        }, 1000);
        tab.id += "tab";
        tabcontainer.appendChild(iframe);
        tabs.appendChild(tab);
        tab.addEventListener("click", function () {
          activateTab(tab, iframe);
        });
        activateTab(tab, iframe);
      }
      function activateTab(tab, iframe) {
        activeTabs.forEach((tab) => tab.classList.remove("active"));
        activeIframes.forEach((iframe) =>
          iframe.classList.remove("active-iframe")
        );
        activeIframes = activeIframes.filter((item) => item !== iframe);
        activeTabs = activeTabs.filter((item) => item !== tab);
        activeTabs.push(tab);
        activeIframes.push(iframe);
        tab.classList.add("active");
        iframe.classList.add("active-iframe");
      }
      plus.addEventListener("click", createTab);
      x.addEventListener("click", function () {
        const activeTab = activeTabs.pop();
        const activeIframe = activeIframes.pop();
        if (activeTab && activeIframe) {
          activeTab.classList.remove("active");
          activeIframe.classList.remove("active-iframe");
          activeIframe.remove();
          activeTab.remove();
          if (activeTabs.length > 0) {
            const lastTab = activeTabs[activeTabs.length - 1];
            const lastIframe = activeIframes[activeIframes.length - 1];
            activateTab(lastTab, lastIframe);
          }
        }
      });
      window.addEventListener("load", createTab);
    </script>

      gtag('config', 'G-XERNXVBLJ4');
    </script>
    <script src="./data/js/loading.js"></script>
    <script src="./data/js/theme.js"></script>
  </body>
</html>
