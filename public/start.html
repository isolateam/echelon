<body>
    <iframe src="/index" id="fram"></iframe>

    <script>
        const fram = document.getElementById("fram");

        let sjFrame;
        let controller;

        function search(input) {
            input = input.trim();

            const searchTemplate =
                localStorage.getItem("engine") ||
                "https://google.com/search?q=%s";

            try {
                return new URL(input).toString();
            } catch {
                try {
                    const url = new URL(`http://${input}`);

                    if (url.hostname.includes(".")) {
                        return url.toString();
                    }

                    throw new Error();
                } catch {
                    return searchTemplate.replace(
                        "%s",
                        encodeURIComponent(input)
                    );
                }
            }
        }

        async function initScramjet() {
            await navigator.serviceWorker.register("/sw.js", {
                scope: "/"
            });

            if (!navigator.serviceWorker.controller) {
                await new Promise(resolve => {
                    navigator.serviceWorker.addEventListener(
                        "controllerchange",
                        resolve,
                        { once: true }
                    );
                });
            }

            const serviceworker = navigator.serviceWorker.controller;

            const wispUrl =
                `${location.protocol === "https:" ? "wss:" : "ws:"}//${location.host}/wisp/`;

            const { default: EpoxyClient } =
                await import("/epoxy/index.mjs");

            const transport = new EpoxyClient({
                wisp: wispUrl
            });

            controller = new $scramjetController.Controller({
                serviceworker,
                transport,
                config: {
                    prefix: "/~/sj/",
                    scramjetPath: "/scram/scramjet.js",
                    wasmPath: "/scram/scramjet.wasm",
                    injectPath: "/controller/controller.inject.js"
                }
            });

            await controller.wait();

            sjFrame = controller.createFrame(fram);

            const gameUrl = sessionStorage.getItem("gameUrl");
            if (gameUrl) {
            sessionStorage.removeItem("gameUrl");
            sjFrame.go(gameUrl);
            }
        }

        window.tabFrameApi = {
            navigate(url) {
                if (sjFrame && url) sjFrame.go(url);
            },
            search,
            back() {
                fram.contentWindow.history.back();
            },
            forward() {
                fram.contentWindow.history.forward();
            },
            reload() {
                fram.contentWindow.location.reload();
            },
            open() {
                if (fram.src) window.open(fram.src, "_blank");
            }
        };

        setTimeout(() => {
            if (typeof eruda !== "undefined") {
                eruda.destroy();
            }
        }, 30);

        function ntFram() {
            window.open(fram.src);
        }

        initScramjet().catch(console.error);
    </script>
