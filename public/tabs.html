    <title>breakium</title>
    <style>
      @font-face {
        font-family: "FONT2";
        src: url("/data/fonts/AlteHaasGroteskRegular.ttf");
      }

      :root {
        --bg: #121113;
        --bar: #19171a;
        --tab-idle: rgba(255, 255, 255, 0.035);
        --tab-hover: rgba(255, 255, 255, 0.07);
        --tab-active: #262227;
        --text: #eee8e1;
        --text-muted: #96908a;
        --hairline: rgba(255, 255, 255, 0.06);
        --signal: #e8a33d;
      }

      * {
        font-family: "FONT2", sans-serif;
        box-sizing: border-box;
      }

      html, body {
        height: 100%;
        margin: 0;
      }

      body {
        background-color: var(--bg);
        color: var(--text);
      }

      .container {
        position: relative;
        width: 100vw;
        height: 100vh;
      }
      #tabcontainer {
        width: 100%;
        height: 42px;
        background: var(--bar);
        border-bottom: 1px solid var(--hairline);
        padding: 7px 10px 0 10px;
        box-sizing: border-box;
        position: relative;
        z-index: 2;
      }

      #tabs {
        display: flex;
        align-items: flex-end;
        height: 100%;
        gap: 2px;
        overflow-x: auto;
        overflow-y: hidden;
      }

      #tabs::-webkit-scrollbar {
        height: 3px;
      }

      #tabs::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 3px;
      }

      button {
        background: none;
        color: var(--text-muted);
        border: 0;
        cursor: pointer;
        transition: background-color 0.15s ease, color 0.15s ease;
      }

      #tab { height: 32px; min-width: 168px; max-width: 220px; display: flex; align-items: center; justify-content: space-between; margin: 0 1px; padding: 0 8px 0 28px; font-size: 12.5px; font-weight: 500; text-align: left; white-space: nowrap; background-color: var(--tab-idle); background-repeat: no-repeat; background-position: 10px center; background-size: 14px; border-radius: 8px 8px 0 0; flex-shrink: 0; }
      .tab-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
      .tab-close { width: 22px; height: 22px; min-width: 22px; margin-left: 6px; border-radius: 50%; font-size: 15px; line-height: 1; color: var(--text-muted); flex-shrink: 0; }
      .tab-close:hover { background-color: var(--tab-hover); color: var(--text); }

      .active {
        background-color: var(--tab-active) !important;
        color: var(--text);
        font-weight: 600;
        position: relative;
        z-index: 1;
      }
      .active::after {
        content: "";
        position: absolute;
        left: 10px;
        right: 10px;
        bottom: -1px;
        height: 2px;
        background: var(--signal);
        border-radius: 2px;
        box-shadow: 0 0 6px 0 rgba(232, 163, 61, 0.55);
      }
      #plus { width: 28px; height: 28px; min-width: 28px; margin-bottom: 2px; border-radius: 50%; font-size: 15px; line-height: 1; flex-shrink: 0; }
      #plus:hover { background-color: var(--tab-hover); color: var(--text); }

      #x {
        margin-left: 8px;
        margin-right: 6px;
        color: var(--text-muted);
      }
      iframe {
        width: 100vw;
        height: calc(100vh - 42px);
        border: none;
        z-index: 0;
        position: absolute;
        top: 42px;
        left: 0;
        display: none;
        background: var(--bg);
      }

      .active-iframe {
        display: block;
      }

      #icon {
        width: 16px;
        height: 16px;
        vertical-align: middle;
        margin-right: 5px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="tabcontainer">
        <div id="tabs">
          <button id="plus">+</button>
        </div>
      </div>
    </div>
    <script>
    const tc=document.getElementById("tabcontainer"),ts=document.getElementById("tabs"),p=document.getElementById("plus");let at=[],ai=[];

    function createTab(){
      let t=document.createElement("button"),f=document.createElement("iframe"),c=document.createElement("button"),n=document.createElement("span");
      t.id="tab";n.className="tab-title";n.textContent="Loading..";c.className="tab-close";c.textContent="×";t.append(n,c);f.src="/null";
      setInterval(()=>{try{let x=f.contentWindow.document.getElementById("fram");if(!x)return;n.textContent=x.contentDocument.title||"New Tab";let i=x.contentDocument.querySelector('link[rel="icon"]');t.style.backgroundImage=`url(${i?i.href:"/data/images/tabs/icon.png"})`}catch{n.textContent="New Tab";t.style.backgroundImage="url(/data/images/tabs/icon.png)"}},1000);
      tc.appendChild(f);ts.insertBefore(t,p);t.onclick=()=>a(t,f);c.onclick=e=>{e.stopPropagation();d(t,f)};a(t,f)
    }

    function a(t,f){
      at.forEach(x=>x.classList.remove("active"));ai.forEach(x=>x.classList.remove("active-iframe"));
      at=at.filter(x=>x!=t);ai=ai.filter(x=>x!=f);at.push(t);ai.push(f);t.classList.add("active");f.classList.add("active-iframe")
    }

    function d(t,f){
      let w=t.classList.contains("active"),i=at.indexOf(t);if(i>-1){at.splice(i,1);ai.splice(i,1)}t.remove();f.remove();
      if(w&&at.length)a(at.at(-1),ai.at(-1))
    }
    p.onclick=createTab;window.onload=createTab;
    </script>
    
    <script src="./data/js/loading.js"></script>
    <script src="./data/js/theme.js"></script>

  </body>
